<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>입자 인트로 미리보기</title>
<link rel="stylesheet" href="css/style.css?v=82de5e3af9">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=block">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
.top{position:fixed;z-index:30;left:0;right:0;top:0;height:84px;background:#fff;display:flex;align-items:center;padding:0 clamp(20px,4vw,72px);gap:34px;font:700 14px "Pretendard Variable",sans-serif;letter-spacing:.12em;border-bottom:1px solid #eee}
.top img{height:36px;margin-right:auto}.top i{font-style:normal;border:1px solid #111;padding:12px 22px}
@media(max-width:1100px){.top span,.top i{display:none}.top{height:64px}.top img{height:26px}.hi{top:64px!important}}
.hi{position:fixed;left:0;right:0;top:84px;bottom:0}
#pc{position:absolute;inset:0;z-index:5;pointer-events:none}
.veil{position:absolute;inset:0;z-index:4;background:#000;opacity:1;transition:opacity 1.8s ease}
.hi.is-reveal .veil{opacity:0}
.hi .hi__center,.hi .hi__tag{opacity:0;transition:opacity 1.2s ease}
.hi.is-reveal .hi__center{opacity:1;transition-delay:.25s}
.hi.is-reveal .hi__tag{opacity:1;transition-delay:1s}
.hi.is-reveal .hi__title{animation:none}
.btn{position:fixed;z-index:40;right:24px;bottom:24px;background:rgba(255,255,255,.9);border:0;padding:10px 18px;border-radius:99px;font:700 13px "Pretendard Variable";cursor:pointer}
</style></head>
<body>
<div class="top"><img src="assets/img/logo-goldstream-dark.png" alt=""><span>WORK</span><span>LOCATION</span><span>CAMPAIGN</span><span>SPONSORSHIP</span><span>IMPACT</span><span>ABOUT</span><span>BRAND</span><i>CONTACT</i></div>
<button class="btn" onclick="start()">다시 재생</button>
<div class="hi" id="hi">
  <div class="pw-wall" id="wall"></div><div class="hi__shade"></div>
  <div class="veil"></div>
  <canvas id="pc"></canvas>
  <div class="hi__center"><p class="hi__title">GOLDSTREAM</p><p class="hi__sub">ENTERTAINMENT</p></div>
  <p class="hi__tag">이야기를 현실로 만듭니다</p>
</div>
<script>
var P=["assets/img/1789518254143--.png","assets/img/forbidden-poster.jpg","assets/img/1789518301734--.png","assets/img/1789518312319--.png","assets/img/1789518284030--2.png","assets/img/1789518267017--1.png","assets/img/suanara-poster.webp","assets/img/demon-killer-poster.jpg"];
var h='';for(var i=0;i<32;i++)h+='<img src="'+P[(i*3+Math.floor(i/8))%P.length]+'">';document.getElementById('wall').innerHTML=h;

/* ---- particle intro: dust -> swirls into the title -> light sweep -> bursts away ---- */
var hi=document.getElementById('hi'),cv=document.getElementById('pc'),x=cv.getContext('2d');
var W=0,H=0,DPR=1,pts=[],t0=0,raf=0,sprite,spriteGold;
var T={drift:1.4,gather:2.4,hold:2.0,burst:1.6};
var TOTAL=T.drift+T.gather+T.hold+T.burst;
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function easeOut(t){return 1-Math.pow(1-t,3)}
function easeIn(t){return t*t*t}
function makeSprite(c1,c2){var s=document.createElement('canvas');s.width=s.height=64;var g=s.getContext('2d');var r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,c1);r.addColorStop(.25,c2);r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return s}
function size(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0)}
function sample(){
  var o=document.createElement('canvas'),g=o.getContext('2d');o.width=W;o.height=H;
  var fs=Math.min(W*0.056,96);if(W<640)fs=W*0.074;
  g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';
  g.font='400 '+fs+'px Jost, sans-serif';var sp=fs*0.42;g.letterSpacing=sp+'px';
  g.fillText('GOLDSTREAM',W/2+sp/2,H/2-fs*0.1);
  var fs2=Math.max(11,Math.min(W*0.01,16));g.font='300 '+fs2+'px Jost, sans-serif';g.letterSpacing=fs2*0.8+'px';
  g.fillText('ENTERTAINMENT',W/2+fs2*0.4,H/2+fs*0.62);
  var d=g.getImageData(0,0,W,H).data,step=W>=900?2:3,out=[];
  for(var y=0;y<H;y+=step)for(var xx=0;xx<W;xx+=step){if(d[(y*W+xx)*4+3]>128)out.push([xx+(Math.random()-.5)*step,y+(Math.random()-.5)*step])}
  return out;
}
function build(){
  var tg=sample();pts=[];
  sprite=makeSprite('rgba(255,255,255,1)','rgba(255,255,255,.55)');
  spriteGold=makeSprite('rgba(255,244,214,1)','rgba(232,196,120,.6)');
  for(var i=0;i<tg.length;i++){
    var a=Math.random()*6.283,r=Math.random(),spark=Math.random()<0.12;
    pts.push({tx:tg[i][0],ty:tg[i][1],
      sx:Math.random()*W,sy:Math.random()*H,vx:(Math.random()-.5)*22,vy:(Math.random()-.5)*22,
      sw:(Math.random()<.5?-1:1)*(40+Math.random()*120),       // swirl radius while gathering
      bx:Math.cos(a)*(200+r*W*1.1),by:Math.sin(a)*(200+r*H*1.1), // burst vector
      d:tg[i][0]/W,                                               // left->right stagger
      j:Math.random(),r:spark?2.2+Math.random()*1.6:0.7+Math.random()*1.0,
      spark:spark,tw:Math.random()*6.28});
  }
}
function flash(cx,cy,rad,al,warm){var g=x.createRadialGradient(cx,cy,0,cx,cy,rad);g.addColorStop(0,'rgba(255,'+(warm?'240,210':'255,255')+','+al+')');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(cx-rad,cy-rad,rad*2,rad*2)}
function frame(now){
  if(cv.clientWidth!==W||cv.clientHeight!==H){size();build()}
  var t=(now-t0)/1000;x.clearRect(0,0,W,H);
  var ph,k;
  if(t<T.drift){ph=0;k=t/T.drift}
  else if(t<T.drift+T.gather){ph=1;k=(t-T.drift)/T.gather}
  else if(t<T.drift+T.gather+T.hold){ph=2;k=(t-T.drift-T.gather)/T.hold}
  else{ph=3;k=Math.min(1,(t-T.drift-T.gather-T.hold)/T.burst)}
  if(ph===3&&!hi.classList.contains('is-reveal'))hi.classList.add('is-reveal');
  x.globalCompositeOperation='lighter';
  var sweep=-1;if(ph===2){sweep=W*0.2+(W*0.6)*easeOut(Math.min(1,k*1.2))}
  if(ph===2)flash(W/2,H/2,Math.max(W,H)*0.35,0.10*Math.sin(k*3.1416),true);
  if(ph===3&&k<0.5)flash(W/2,H/2,Math.max(W,H)*0.5,0.35*(1-k*2),true);
  for(var i=0;i<pts.length;i++){
    var p=pts[i],px,py,al,sc=1;
    var dx=p.sx+p.vx*t+Math.sin(t*0.9+p.tw)*8,dy=p.sy+p.vy*t+Math.cos(t*0.7+p.tw)*8;
    if(ph===0){px=dx;py=dy;al=0.18+0.5*Math.abs(Math.sin(t*2.2+p.tw))*(0.3+0.7*k)}
    else if(ph===1){
      var e=ease(Math.max(0,Math.min(1,(k-p.d*0.35-p.j*0.1)/(0.55))));
      var ang=e*3.1416*1.2+p.tw,rr=Math.sin(e*3.1416)*p.sw;
      px=dx+(p.tx-dx)*e+Math.cos(ang)*rr;py=dy+(p.ty-dy)*e+Math.sin(ang)*rr*0.6;al=0.25+0.75*e;sc=1+(1-e)*0.6}
    else if(ph===2){
      px=p.tx+Math.sin(t*3+p.tw)*0.35;py=p.ty+Math.cos(t*2.6+p.tw)*0.35;al=0.8+0.2*Math.sin(t*6+p.tw);
      var dsw=Math.abs(p.tx-sweep);if(sweep>0&&dsw<110){var b=1-dsw/110;al=Math.min(1,al+b);sc=1+b*(p.spark?0.5:1.3)}}
    else{var e2=easeIn(Math.min(1,k/(0.55+p.j*0.45)));px=p.tx+p.bx*e2;py=p.ty+p.by*e2;al=(1-e2)*0.95;sc=1+e2*(p.spark?0.4:1.2);
      if(e2>0&&e2<1&&p.spark){x.globalAlpha=al*0.5;x.strokeStyle='#fff';x.lineWidth=1;x.beginPath();x.moveTo(px-p.bx*0.03,py-p.by*0.03);x.lineTo(px,py);x.stroke()}}
    if(al<=0.01)continue;
    x.globalAlpha=al;
    if(p.spark){var s=p.r*sc*6;x.drawImage(p.j<0.5?spriteGold:sprite,px-s/2,py-s/2,s,s)}
    else{x.fillStyle=ph===2?'#fff':'#f1f1f1';x.beginPath();x.arc(px,py,p.r*sc,0,6.283);x.fill()}
  }
  x.globalAlpha=1;x.globalCompositeOperation='source-over';
  if(t<TOTAL+0.2)raf=requestAnimationFrame(frame);
}
function start(){cancelAnimationFrame(raf);hi.classList.remove('is-reveal');size();build();t0=performance.now();raf=requestAnimationFrame(frame)}
var at=location.search.match(/at=([\d.]+)/);
function boot(){
  if(at){var st=document.createElement('style');st.textContent='.hi *{transition:none!important}.pw-wall{animation:none!important}';document.head.appendChild(st);
    size();build();t0=performance.now()-at[1]*1000;frame(performance.now());cancelAnimationFrame(raf);document.body.setAttribute('data-shot',cv.toDataURL());if(+at[1]>=T.drift+T.gather+T.hold)hi.classList.add('is-reveal');}
  else start();
}
document.fonts.load('400 40px Jost').then(boot,boot);
</script>
</body></html>
