<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="강철비 (Steel Rain) 포스터">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="0.55" stop-color="#243039"/>
      <stop offset="1" stop-color="#39464f"/>
    </linearGradient>
    <linearGradient id="poster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48586a"/>
      <stop offset="0.5" stop-color="#26313c"/>
      <stop offset="1" stop-color="#10161c"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="78%" r="60%">
      <stop offset="0" stop-color="#88b0d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#88b0d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3f7"/>
      <stop offset="1" stop-color="#9fb2c2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>
  <g stroke="url(#streak)" stroke-width="3" opacity="0.22">
    <line x1="180" y1="-40" x2="60" y2="840"/>
    <line x1="360" y1="-40" x2="240" y2="840"/>
    <line x1="560" y1="-40" x2="440" y2="840"/>
  </g>

  <text x="70" y="470" font-family="'Pretendard Variable', sans-serif" font-size="150" font-weight="800" fill="#f1f5f9">강철비</text>
  <text x="74" y="524" font-family="'IBM Plex Mono', monospace" font-size="26" font-weight="500" letter-spacing="9" fill="#cdd9e4">STEEL RAIN</text>
  <text x="74" y="690" font-family="'Pretendard Variable', sans-serif" font-size="22" font-weight="600" letter-spacing="0.5" fill="#f1f5f9" opacity="0.8">2017 · 극장 개봉 · 양우석 감독</text>

  <!-- poster one-sheet -->
  <g transform="rotate(-3 940 400)">
    <rect x="742" y="70" width="404" height="640" rx="8" fill="#000000" opacity="0.4"/>
    <rect x="734" y="62" width="404" height="640" rx="8" fill="url(#poster)" stroke="#a9bccb" stroke-opacity="0.5" stroke-width="1.5"/>
    <g stroke="#dfe8ef" stroke-width="2.5" opacity="0.5">
      <line x1="800" y1="90" x2="770" y2="300"/>
      <line x1="880" y1="90" x2="850" y2="300"/>
      <line x1="1080" y1="90" x2="1050" y2="300"/>
    </g>
    <text x="936" y="430" text-anchor="middle" font-family="'Pretendard Variable', sans-serif" font-size="118" font-weight="800" fill="#f4f7fa">강철비</text>
    <text x="936" y="474" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="19" letter-spacing="8" fill="#cdd9e4">STEEL RAIN</text>
    <text x="936" y="600" text-anchor="middle" font-family="'Pretendard Variable', sans-serif" font-size="28" font-weight="700" fill="#f4f7fa">정우성 · 곽도원</text>
    <text x="936" y="642" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="17" letter-spacing="3" fill="#f4f7fa" opacity="0.62">2017</text>
  </g>

  <text x="70" y="92" font-family="'Pretendard Variable', sans-serif" font-size="23" font-weight="700" letter-spacing="4" fill="#f1f5f9" opacity="0.5">GOLDSTREAM</text>
</svg>
