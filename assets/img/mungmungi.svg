<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="멍뭉이 (My Heart Puppy) 포스터">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7d5b"/>
      <stop offset="1" stop-color="#8ec06a"/>
    </linearGradient>
    <linearGradient id="poster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3d6"/>
      <stop offset="0.55" stop-color="#f3e6b8"/>
      <stop offset="1" stop-color="#e8d491"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="26%" r="58%">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff3c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <text x="70" y="452" font-family="'Pretendard Variable', sans-serif" font-size="140" font-weight="800" fill="#ffffff">멍뭉이</text>
  <text x="76" y="504" font-family="'IBM Plex Mono', monospace" font-size="24" font-weight="500" letter-spacing="5" fill="#eafbe4">MY HEART PUPPY</text>
  <text x="74" y="690" font-family="'Pretendard Variable', sans-serif" font-size="22" font-weight="600" fill="#ffffff" opacity="0.9">2023 · 극장 개봉 · 김주환 감독</text>

  <!-- poster one-sheet: warm paper card with a friendly dog silhouette -->
  <g transform="rotate(-3 940 400)">
    <rect x="742" y="70" width="404" height="640" rx="8" fill="#1c2b1f" opacity="0.35"/>
    <rect x="734" y="62" width="404" height="640" rx="8" fill="url(#poster)" stroke="#2f7d5b" stroke-opacity="0.4" stroke-width="1.5"/>
    <!-- dog silhouette -->
    <g fill="#2f7d5b" opacity="0.88">
      <path d="M866 190 Q846 150 872 132 Q896 122 900 156 Q902 176 890 196 Z"/>
      <path d="M1006 190 Q1026 150 1000 132 Q976 122 972 156 Q970 176 982 196 Z"/>
      <ellipse cx="936" cy="230" rx="86" ry="72"/>
      <circle cx="906" cy="220" r="8" fill="#fbf3d6"/>
      <circle cx="966" cy="220" r="8" fill="#fbf3d6"/>
      <ellipse cx="936" cy="248" rx="14" ry="10" fill="#fbf3d6"/>
    </g>
    <text x="936" y="440" text-anchor="middle" font-family="'Pretendard Variable', sans-serif" font-size="92" font-weight="800" fill="#1c2b1f">멍뭉이</text>
    <text x="936" y="480" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="18" letter-spacing="5" fill="#3a5a3f">MY HEART PUPPY</text>
    <text x="936" y="600" text-anchor="middle" font-family="'Pretendard Variable', sans-serif" font-size="26" font-weight="700" fill="#1c2b1f">유연석 · 차태현</text>
    <text x="936" y="642" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="17" letter-spacing="3" fill="#3a5a3f" opacity="0.75">2023</text>
  </g>

  <text x="70" y="92" font-family="'Pretendard Variable', sans-serif" font-size="23" font-weight="700" letter-spacing="4" fill="#ffffff" opacity="0.6">GOLDSTREAM</text>
</svg>
