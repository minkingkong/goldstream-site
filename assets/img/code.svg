<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="코드 (CODE) 포스터">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0917"/>
      <stop offset="1" stop-color="#1c1338"/>
    </linearGradient>
    <linearGradient id="poster" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241a4d"/>
      <stop offset="0.55" stop-color="#120c2b"/>
      <stop offset="1" stop-color="#05040d"/>
    </linearGradient>
    <radialGradient id="glow" cx="34%" cy="30%" r="55%">
      <stop offset="0" stop-color="#7c4bff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c4bff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#glow)"/>

  <g font-family="'IBM Plex Mono', ui-monospace, monospace" fill="#ffffff" opacity="0.12" font-size="21">
    <text x="70" y="150">const wish = code.invite(user);</text>
    <text x="70" y="186">if (wish.granted) price += soul;</text>
    <text x="70" y="222">// 소원의 대가</text>
    <text x="70" y="640">while (true) { desire++; }</text>
  </g>
  <text x="70" y="470" font-family="'Pretendard Variable', sans-serif" font-size="132" font-weight="800" fill="#ffffff">코드</text>
  <text x="74" y="524" font-family="'IBM Plex Mono', monospace" font-size="26" font-weight="500" letter-spacing="10" fill="#b79bff">C O D E</text>
  <text x="74" y="690" font-family="'Pretendard Variable', sans-serif" font-size="22" font-weight="600" letter-spacing="0.5" fill="#ffffff" opacity="0.8">DISNEY+ · 2027 · 유수민 감독</text>

  <!-- poster one-sheet -->
  <g transform="rotate(-3 940 400)">
    <rect x="742" y="70" width="404" height="640" rx="8" fill="#000000" opacity="0.45"/>
    <rect x="734" y="62" width="404" height="640" rx="8" fill="url(#poster)" stroke="#7c4bff" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="874" y="150" width="124" height="124" rx="30" fill="none" stroke="#c3adff" stroke-width="4"/>
    <line x1="936" y1="212" x2="936" y2="150" stroke="#c3adff" stroke-width="4"/>
    <circle cx="936" cy="214" r="30" fill="none" stroke="#c3adff" stroke-width="4"/>
    <text x="936" y="430" text-anchor="middle" font-family="'Pretendard Variable', sans-serif" font-size="104" font-weight="800" fill="#ffffff">코드</text>
    <text x="936" y="474" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="20" letter-spacing="9" fill="#b79bff">C O D E</text>
    <text x="936" y="600" text-anchor="middle" font-family="'Pretendard Variable', sans-serif" font-size="30" font-weight="700" fill="#ffffff">남주혁</text>
    <text x="936" y="642" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="17" letter-spacing="3" fill="#ffffff" opacity="0.62">2027 · DISNEY+</text>
  </g>

  <text x="70" y="92" font-family="'Pretendard Variable', sans-serif" font-size="23" font-weight="700" letter-spacing="4" fill="#ffffff" opacity="0.5">GOLDSTREAM</text>
</svg>
