<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — GOLDSTREAM</title>
  <meta name="description" content="GOLDSTREAM 제작·투자·배급 문의." />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/PretendardVariable.woff2" crossorigin />
  <link rel="stylesheet" href="css/style.css?v=1f3bb2c589" />
</head>
<body>
  <header class="hd">
    <div class="wrap hd__in">
      <a class="hd__logo" href="index.html" data-field="site.brand" data-highlight="GOLD">GOLDSTREAM</a>
      <nav class="hd__nav">
        <a href="works.html">works</a>
        <a href="about.html">about</a>
        <a href="contact.html" aria-current="page">contact</a>
      </nav>
    </div>
  </header>

  <main class="page wrap">
    <h1 class="page__title" data-field="pages.contact.title">Contact</h1>
    <p class="contact-big" data-field="pages.contact.big" data-multiline>함께 만들<br />이야기가 있다면.</p>

    <div class="contact-direct reveal">
      <a class="contact-direct__item" href="mailto:hello@goldstream.co.kr" data-field="contact.email" data-mailto>hello@goldstream.co.kr</a>
      <a class="contact-direct__item" href="tel:" data-field="contact.phone" data-tel>010-0000-0000</a>
    </div>

    <section class="about-section reveal">
      <h2 class="eyebrow" style="display:block;margin-bottom:16px">Inquiries</h2>
      <div class="tag-row" id="contact-inquiries"></div>
    </section>

    <section class="about-section reveal">
      <h2 class="eyebrow" style="display:block;margin-bottom:8px">Offices</h2>
      <p class="office-intro" data-field="contact.officesIntro">광주에서 시작해, 서울과 세계로 이야기를 잇습니다.</p>
      <div class="office-grid" id="contact-offices"></div>
    </section>
  </main>

  <footer class="ft">
    <div class="wrap ft__in">
      <span>© 2026 <span data-field="site.brand">GOLDSTREAM</span></span>
      <a href="mailto:hello@goldstream.co.kr" data-field="contact.email" data-mailto>hello@goldstream.co.kr</a>
      <span data-field="contact.address">서울특별시 마포구</span>
    </div>
  </footer>

  <script src="js/site.js?v=47118b6808"></script>
</body>
</html>
