  <script>
  /* LOCATION: the tabs switch the map between the offices listed on the left */
  (function () {
    var frame = document.getElementById("ct3-map"), open = document.getElementById("ct3-open");
    var tabs = [].slice.call(document.querySelectorAll(".ct3__tabs button"));
    function addr(i) {
      var el = document.querySelector('[data-field="contact.offices.' + i + '.address"]');
      return (el ? el.textContent : "").replace("전남광주통합특별시", "광주광역시").trim();
    }
    function show(i) {
      var q = addr(i);
      frame.src = "https://maps.google.com/maps?q=" + encodeURIComponent(q) + "&z=16&output=embed&hl=ko";
      open.href = "https://map.naver.com/p/search/" + encodeURIComponent(q);
      tabs.forEach(function (t) { t.setAttribute("aria-selected", +t.getAttribute("data-office") === i ? "true" : "false"); });
    }
    tabs.forEach(function (t) { t.addEventListener("click", function () { show(+t.getAttribute("data-office")); }); });
    show(0);
  })();
  </script>
