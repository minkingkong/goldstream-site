<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hd">
    <div class="wrap hd__in">
      <a class="hd__logo" href="index.html">GOLDSTREAM</a>
      <nav class="hd__nav">
        <a href="works.html">works</a>
        <a href="about.html">about</a>
        <a href="contact.html" aria-current="page">contact</a>

    <h1 class="page__title">Contact</h1>
    <p class="contact-big">함께 만들<br />이야기가 있다면.</p>

    <div class="contact-grid">
      <div>
        <h4>General</h4>
        <a class="mail" href="mailto:hello@goldstream.co.kr" data-field="contact.email" data-mailto>hello@goldstream.co.kr</a>

      <div>
        <h4>Inquiries</h4>
        <div id="contact-inquiries"></div>
      </div>
      <div>
        <h4>Studio</h4>
        <p data-field="contact.address">서울특별시 마포구</p>
        <p data-field="contact.hours">Mon–Fri 10:00–19:00</p>
      </div>
    </div>
  </main>

  <footer class="ft">
    <div class="wrap ft__in">
      <span>© 2026 GOLDSTREAM</span>
      <a href="mailto:hello@goldstream.co.kr" data-field="contact.email" data-mailto>hello@goldstream.co.kr</a>
