<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://goldstream.kr/about.html" />
  <meta property="og:title" content="About — GOLDSTREAM" />
  <meta property="og:description" content="골드스트림 엔터테인먼트 대표이사 김정환 — 인사말과 프로필." />
  <meta property="og:image" content="https://goldstream.kr/assets/img/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/PretendardVariable.woff2" crossorigin />
  <link rel="stylesheet" href="css/style.css?v=8e5b312472" />
</head>
<body>
  <header class="hd">
    <div class="wrap hd__in">
      <a class="hd__logo" href="index.html" data-field="site.brand">GOLDSTREAM</a>
      <nav class="hd__nav">
        <a href="works.html">works</a>
        <a href="about.html" aria-current="page">about</a>
        <a href="contact.html">contact</a>
      </nav>
    </div>
  </header>

  <main class="page wrap">
    <h1 class="page__title" data-field="pages.about.title">About</h1>

    <div class="about">
      <div class="about__portrait reveal">
        <img data-field="about.portrait" src="assets/img/portrait.svg" alt="김정환 대표이사" />
      </div>
      <div class="about__body reveal">
        <p class="about__name" data-field="about.name">김정환</p>

        <h2 class="about__block-title" data-field="about.greetingTitle">대표이사 인사말</h2>
        <div class="about__prose" id="about-greeting"></div>
        <p class="about__sign" data-field="about.greetingSign"></p>
      </div>
    </div>

    <section class="about-section reveal">
      <h2 class="about__block-title" data-field="about.profileTitle">Profile</h2>
      <div class="about__prose about__prose--wide" id="about-profile"></div>
    </section>

    <section class="about-section reveal" id="about-press-wrap">
      <h2 class="about__block-title">관련 기사</h2>
      <nav class="modal__links" id="about-press" aria-label="관련 보도"></nav>
    </section>

    <section class="about-section reveal">
      <h2 class="about__block-title" data-field="about.currentBusinessTitle">Current Business</h2>
      <ul class="about-list" id="about-business"></ul>
    </section>

    <div class="about-grid">
      <section class="reveal">
        <h2 class="eyebrow" style="display:block;margin-bottom:14px">Company</h2>
        <dl class="facts" id="about-facts"></dl>
      </section>
      <section class="reveal">
        <h2 class="eyebrow" style="display:block;margin-bottom:14px">Selected Filmography</h2>
        <dl class="facts" id="about-recognition"></dl>
      </section>
    </div>
  </main>

  <footer class="ft">
    <div class="wrap ft__in">
      <span>© 2026 <span data-field="site.brand">GOLDSTREAM</span></span>
      <a href="mailto:hello@goldstream.co.kr" data-field="contact.email" data-mailto>hello@goldstream.co.kr</a>
      <span data-field="contact.address">서울특별시 마포구</span>
    </div>
  </footer>

  <script src="js/site.js?v=12dd7ec8fa"></script>
</body>
</html>
